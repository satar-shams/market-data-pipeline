name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      API_DB_PASSWORD: ci_password
      POSTGRES_DB: market_data
      LOG_LEVEL: INFO
      TICKERS: AAPL,MSFT

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pydantic pydantic-settings pytest fastapi httpx sqlalchemy psycopg2-binary

      - name: Run unit tests
        run: pytest tests/unit/ -v
