services:
  - type: web
    name: market-data-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: market-data-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: market-data-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: market-data-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: market-data-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: market-data-db
          property: password
      - key: API_DB_USER
        sync: false
      - key: API_DB_PASSWORD
        sync: false
      - key: TICKERS
        value: AAPL,MSFT,GOOGL,AMZN,SPY,NVDA
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: market-data-db
    plan: free
